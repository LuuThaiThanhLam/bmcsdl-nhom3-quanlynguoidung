<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Đăng nhập - BMCSDL Nhóm 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 40px;
      width: 420px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-box h1 {
      font-size: 22px;
      color: #1a237e;
      text-align: center;
      margin-bottom: 5px;
    }

    .login-box .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .login-box label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.3s;
    }

    .login-box input:focus {
      border-color: #1a237e;
      outline: none;
    }

    .login-box .btn-login {
      width: 100%;
      padding: 12px;
      background: #1a237e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    .login-box .btn-login:hover {
      background: #283593;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }

    .info-box {
      margin-top: 25px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
    }

    .info-box code {
      background: #e0e0e0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .info-box table {
      width: 100%;
      margin-top: 8px;
    }

    .info-box td {
      padding: 3px 0;
    }

    .role-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: white;
      margin-left: 5px;
    }

    .role-admin {
      background: #c62828;
    }

    .role-manager {
      background: #f57c00;
    }

    .role-user {
      background: #2e7d32;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>HỆ THỐNG QUẢN LÝ NGƯỜI DÙNG</h1>
    <p class="subtitle">Bảo mật CSDL - Nhóm 3</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form action="/login" method="post">
      <label>Username Oracle</label>
      <input type="text" name="username" placeholder="Nhập username Oracle..." required />
      <label>Password</label>
      <input type="password" name="password" placeholder="Nhập mật khẩu..." required />
      <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
    </form>

    <div class="info-box">
      <strong>Tài khoản mẫu:</strong>
      <table>
        <tr>
          <td>Admin</td>
          <td><code>APP_DBA_ADMIN</code></td>
          <td><span class="role-tag role-admin">ADMIN</span></td>
        </tr>
        <tr>
          <td>Manager</td>
          <td><code>APP_MANAGER_PROFILE</code></td>
          <td><span class="role-tag role-manager">MANAGER</span></td>
        </tr>
        <tr>
          <td>User</td>
          <td><code>APP_USER_1</code></td>
          <td><span class="role-tag role-user">USER</span></td>
        </tr>
      </table>
      <p style="margin-top: 8px; font-size: 12px">
        Mật khẩu: <code>123456</code>
      </p>
    </div>
  </div>
</body>

</html>
